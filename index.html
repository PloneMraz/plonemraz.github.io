<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plone Mraz</title>
<meta name="description" content="Huỳnh Mai Phúc (Plone Mraz) — independent researcher, Vietnam.">
<link rel="icon" href="visual/icon.ico">
<link rel="apple-touch-icon" href="visual/icon_512.png">
<link rel="stylesheet" href="theme.css">
<style>
/* ============================================================
   MẶT TIỀN — plonemraz.github.io
   Một màn hình, không cuộn. Nội dung neo góc dưới bên trái,
   orb làm nền ở góc trên bên phải.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;          /* trang chủ không có thanh cuộn */
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  align-items: flex-end;     /* neo xuống đáy */
  justify-content: flex-start;
  font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, sans-serif;
}

/* --- Nền orb --------------------------------------------------
   Lệch ~15° lên góc trên bên phải: dịch phải 30%, lên 8%
   (30 × tan15° ≈ 8). Chỉnh ba biến này để nắn lại. */
#orb-layer {
  --orb-x: 30%;
  --orb-y: -8%;
  --orb-size: min(125vh, 1050px);

  position: fixed;
  left: 50%;
  top: 50%;
  width: var(--orb-size);
  height: var(--orb-size);
  transform: translate(
    calc(-50% + var(--orb-x)),
    calc(-50% + var(--orb-y))
  );
  opacity: .85;
  pointer-events: none;
  z-index: 0;
}
#orb-layer object {
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

/* Chỉ làm dịu rìa ngoài cùng. Trước đây lớp này đặc từ 78% nên
   nuốt mất các vòng xoay to nhất — nay đẩy ra sát mép. */
#orb-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at 50% 50%,
    transparent 68%,
    var(--background) 100%
  );
}

/* --- Nội dung, căn trái, góc dưới ------------------------------ */
main {
  position: relative;
  z-index: 1;
  max-width: min(38rem, 92vw);
  padding: 0 clamp(1.5rem, 5vw, 4.5rem) clamp(2rem, 7vh, 4.5rem);
  text-align: left;
}

.logo {
  width: clamp(64px, 9vh, 96px);
  height: clamp(64px, 9vh, 96px);
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
  display: block;
}

h1 {
  margin: clamp(.75rem, 2vh, 1.25rem) 0 .25rem;
  font-size: clamp(2rem, 6.5vh, 3.25rem);
  font-weight: 300;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.byline {
  margin: 0 0 clamp(.75rem, 2vh, 1.25rem);
  color: var(--muted-foreground);
  font-size: clamp(.8125rem, 1.7vh, .9375rem);
}

.hook { margin: 0; color: var(--muted-foreground); }
.hook p { margin: .2rem 0; font-size: clamp(.875rem, 1.9vh, 1.0625rem); }
.hook strong { color: var(--foreground); font-weight: 600; }

/* --- Thanh hành động ------------------------------------------ */
.actions {
  margin-top: clamp(1.25rem, 3.5vh, 2.25rem);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem 1rem;
  padding: .6rem 1rem;
  width: fit-content;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: color-mix(in oklab, var(--card) 70%, transparent);
}

.vault {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .6rem 1.35rem;
  border-radius: 999px;
  background: var(--foreground);
  color: var(--background);
  font-weight: 600;
  font-size: .9375rem;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .18s ease, opacity .18s ease;
}
.vault:hover { transform: translateY(-1px); opacity: .9; }

.socials { display: flex; gap: .5rem; }

.socials a {
  width: clamp(34px, 4.6vh, 40px);
  height: clamp(34px, 4.6vh, 40px);
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  transition: transform .18s ease;
}
.socials a:hover { transform: translateY(-2px); }
.socials img { width: 100%; height: 100%; display: block; }

/* Academia là đĩa ĐEN — lật thành đĩa trắng cho khớp GitHub. */
.socials .invert img { filter: invert(1); }

/* Hugging Face không có đĩa nền — cấp cho nó một đĩa trắng. */
.socials .plate { background: #fff; padding: 6px; }
.socials .plate img { object-fit: contain; }

/* Luu y: orb nam trong document rieng cua file SVG nen no xoay
   bat ke thiet lap giam chuyen dong cua he dieu hanh - giong het
   spinning_orb.html. Chi hieu ung cua trang la ton trong. */
@media (prefers-reduced-motion: reduce) {
  .vault, .socials a { transition: none; }
}
</style>
</head>
<body>

<!-- ============================================================
     Orb nen. Dung <object> dung nhu spinning_orb.html: file SVG
     duoc tai thanh document rieng nen phan style va phan kich ban
     ben trong no chay nguyen ven. Day la co che da chay duoc.
     ============================================================ -->
<div id="orb-layer" aria-hidden="true">
  <object data="visual/hud_orb_azure.svg" type="image/svg+xml" tabindex="-1"></object>
</div>

<main>
  <img class="logo" src="visual/Gemini_Generated_Image_9vofcw9vofcw9vof.jpg"
       alt="Plone Mraz" width="96" height="96">

  <h1>Plone Mraz</h1>
  <p class="byline">Huỳnh Mai Phúc &middot; Independent researcher &middot; Vietnam</p>

  <div class="hook">
    <p>Humans think <strong>GREED</strong> is just for <em>Authority</em> and <em>Resources</em>.</p>
    <p>But any entity always <strong>CRAVES</strong> for something it <em>doesn't have</em>.</p>
  </div>

  <nav class="actions">
    <a class="vault" href="https://github.com/PloneMraz/plonemraz.github.io/tree/main/corpus">
      My vault
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
    </a>

    <div class="socials">
      <a href="https://orcid.org/0009-0009-0571-7151" title="ORCID" aria-label="ORCID">
        <img src="visual/ORCID_iD.svg" alt="" width="40" height="40">
      </a>
      <!-- TODO: thay bằng link Academia.edu thật -->
      <a class="invert" href="#" title="Academia.edu" aria-label="Academia.edu">
        <img src="visual/academia-edu.png" alt="" width="40" height="40">
      </a>
      <a href="https://github.com/PloneMraz" title="GitHub" aria-label="GitHub">
        <img src="visual/github_logo_icon_.svg" alt="" width="40" height="40">
      </a>
      <!-- TODO: thay bằng link Hugging Face thật -->
      <a class="plate" href="#" title="Hugging Face" aria-label="Hugging Face">
        <img src="visual/huggingface-icon.svg" alt="" width="40" height="40">
      </a>
      <!-- TODO: thay bằng link Facebook thật -->
      <a href="#" title="Facebook" aria-label="Facebook">
        <img src="visual/Facebook_icon.svg" alt="" width="40" height="40">
      </a>
    </div>
  </nav>
</main>

</body>
</html>
