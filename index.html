<!DOCTYPE html>

<style>
/* ============================================================
   MẶT TIỀN — plonemraz.github.io
   Một màn hình, không cuộn. Nội dung neo góc dưới bên trái,
   orb làm nền ở góc trên bên phải.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;          /* trang chủ không có thanh cuộn */
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  align-items: flex-end;     /* neo xuống đáy */
  justify-content: flex-start;
  font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, sans-serif;
}

/* --- Nền orb --------------------------------------------------
   Lệch ~15° lên góc trên bên phải: dịch phải 30%, lên 8%
   (30 × tan15° ≈ 8). Chỉnh ba biến này để nắn lại. */
#orb-layer {
  --orb-x: 30%;
  --orb-y: -8%;
  --orb-size: min(125vh, 1050px);

  position: fixed;
  left: 50%;
  top: 50%;
  width: var(--orb-size);
  height: var(--orb-size);
  transform: translate(
    calc(-50% + var(--orb-x)),
    calc(-50% + var(--orb-y))
  );
  opacity: .85;
  pointer-events: none;
  z-index: 0;
}
#orb-layer svg { width: 100%; height: 100%; display: block; }

/* Chỉ làm dịu rìa ngoài cùng. Trước đây lớp này đặc từ 78% nên
   nuốt mất các vòng xoay to nhất — nay đẩy ra sát mép. */
#orb-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at 50% 50%,
    transparent 68%,
    var(--background) 100%
  );
}

/* --- Nội dung, căn trái, góc dưới ------------------------------ */
main {
  position: relative;
  z-index: 1;
  max-width: min(38rem, 92vw);
  padding: 0 clamp(1.5rem, 5vw, 4.5rem) clamp(2rem, 7vh, 4.5rem);
  text-align: left;
}

.logo {
  width: clamp(64px, 9vh, 96px);
  height: clamp(64px, 9vh, 96px);
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
  display: block;
}

h1 {
  margin: clamp(.75rem, 2vh, 1.25rem) 0 .25rem;
  font-size: clamp(2rem, 6.5vh, 3.25rem);
  font-weight: 300;
  letter-spacing: -.02em;
  line-height: 1.05;
}

.byline {
  margin: 0 0 clamp(.75rem, 2vh, 1.25rem);
  color: var(--muted-foreground);
  font-size: clamp(.8125rem, 1.7vh, .9375rem);
}

.hook { margin: 0; color: var(--muted-foreground); }
.hook p { margin: .2rem 0; font-size: clamp(.875rem, 1.9vh, 1.0625rem); }
.hook strong { color: var(--foreground); font-weight: 600; }

/* --- Thanh hành động ------------------------------------------ */
.actions {
  margin-top: clamp(1.25rem, 3.5vh, 2.25rem);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem 1rem;
  padding: .6rem 1rem;
  width: fit-content;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: color-mix(in oklab, var(--card) 70%, transparent);
}

.vault {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .6rem 1.35rem;
  border-radius: 999px;
  background: var(--foreground);
  color: var(--background);
  font-weight: 600;
  font-size: .9375rem;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .18s ease, opacity .18s ease;
}
.vault:hover { transform: translateY(-1px); opacity: .9; }

.socials { display: flex; gap: .5rem; }

.socials a {
  width: clamp(34px, 4.6vh, 40px);
  height: clamp(34px, 4.6vh, 40px);
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  transition: transform .18s ease;
}
.socials a:hover { transform: translateY(-2px); }
.socials img { width: 100%; height: 100%; display: block; }

/* Academia là đĩa ĐEN — lật thành đĩa trắng cho khớp GitHub. */
.socials .invert img { filter: invert(1); }

/* Hugging Face không có đĩa nền — cấp cho nó một đĩa trắng. */
.socials .plate { background: #fff; padding: 6px; }
.socials .plate img { object-fit: contain; }

/* Orb co y KHONG ton trong giam chuyen dong: no la dac trung
   nhan dien cua trang. Chi hieu ung giao dien la ton trong. */
@media (prefers-reduced-motion: reduce) {
  .vault, .socials a { transition: none; }
}
</style>
</head>
<body>

<!-- ============================================================
     Orb nền. Bắt buộc nhúng inline: lõi merkaba do script vẽ,
     mà script trong SVG không chạy nếu tải qua <img> hay CSS.
     ============================================================ -->
<div id="orb-layer" aria-hidden="true">
<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes orbCW    { to { transform: rotate(360deg); } }
@keyframes orbCCW   { to { transform: rotate(-360deg); } }
@keyframes orbPulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
#orb-layer .s1, #orb-layer .s2, #orb-layer .s3, #orb-layer .s4 {
  transform-origin: 340px 280px;
  transform-box: view-box;
}
#orb-layer .s1 { animation: orbCW  48s linear infinite; }
#orb-layer .s2 { animation: orbCCW 32s linear infinite; }
#orb-layer .s3 { animation: orbCW  20s linear infinite; }
#orb-layer .s4 { animation: orbCCW 60s linear infinite; }
#orb-layer .pl { animation: orbPulse 3.2s ease-in-out infinite; }
</style>
<g fill="none" stroke="#378ADD" stroke-linecap="round" stroke-linejoin="round">

</g>
<g class="s2">

</g>
<g class="s3">

</g>
<g class="s4">
<circle cx="340" cy="280" r="186" stroke-width="0.5" stroke-dasharray="3 14" opacity=".65"/>

<circle cx="340" cy="280" r="150" stroke-width="1" opacity=".85"/>

<g id="star3d-container" class="s2" stroke-width="1.8" opacity="0.95">

<script>
// Lõi merkaba: hai tứ diện lồng ngược, chiếu trực giao, tự xoay.
(function () {
  var path = document.getElementById('star3d-path');
  if (!path) return;

  var cx = 340, cy = 280, size = 126;
  var V = [
    { x: 0, y: -size, z: 0 },
    { x: size * 0.942, y: size * 0.333, z: 0 },
    { x: -size * 0.471, y: size * 0.333, z: size * 0.816 },
    { x: -size * 0.471, y: size * 0.333, z: -size * 0.816 },
    { x: 0, y: size, z: 0 },
    { x: -size * 0.942, y: -size * 0.333, z: 0 },
    { x: size * 0.471, y: -size * 0.333, z: -size * 0.816 },
    { x: size * 0.471, y: -size * 0.333, z: size * 0.816 }
  ];
  var E = [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1],
           [4,5],[4,6],[4,7],[5,6],[6,7],[7,5]];

  var theta = 0, speed = 0.012;
  var tiltX = 15 * Math.PI / 180, tiltZ = 5 * Math.PI / 180;
  var cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
  var cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);

  function frame() {
    theta -= speed;
    var cosT = Math.cos(theta), sinT = Math.sin(theta);
    var p = V.map(function (v) {
      var x1 = v.x * cosT - v.z * sinT;
      var z1 = v.x * sinT + v.z * cosT;
      var y2 = v.y * cosX - z1 * sinX;
      return { x: x1 * cosZ - y2 * sinZ, y: x1 * sinZ + y2 * cosZ };
    });
    var d = '';
    for (var i = 0; i < E.length; i++) {
      var a = p[E[i][0]], b = p[E[i][1]];
      d += 'M ' + (cx + a.x) + ' ' + (cy + a.y) +
           ' L ' + (cx + b.x) + ' ' + (cy + b.y) + ' ';
    }
    path.setAttribute('d', d);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
